name: marktext_plus
description: A lightweight Markdown editor built with Flutter.
version: 1.6.1+1
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # A web view for plugins that draw their own page, opened only when one
  # actually does — see docs/design/plugin-drawn-ui.md.
  #
  # This package rather than the alternatives, and the reason is the first
  # line of what this editor claims to be:
  #
  # - `webview_cef` embeds and covers all three desktops, but ships CEF: the
  #   installer goes from tens of megabytes to hundreds. That is the opposite
  #   of the thing being sold.
  # - `flutter_inappwebview` embeds and is light, but has no Linux support at
  #   all — an author would write a page on macOS and Linux readers would find
  #   it does not exist.
  # - This one uses each platform's own web view (WebView2, WKWebView,
  #   WebKitGTK), so nothing is bundled, and it behaves the same on all three.
  #   The cost is that the page opens in a window of its own rather than
  #   inside a pane, which for a plugin's own full page is arguably where it
  #   belongs.
  desktop_webview_window: ^0.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1
  flutter_math_fork: ^0.7.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  pdf: ^3.11.1
  # 系统打印对话框。依赖的 pdf 本就在用，导出 PDF 与打印共用同一套排版。
  printing: ^5.14.3
  # GBK 等中日韩传统编码的解码。内置的 dart:convert 只有 UTF-8/16 与 Latin-1。
  charset: ^2.0.1
  desktop_drop: ^0.4.4
  pasteboard: ^0.5.0
  window_manager: ^0.4.3
  # Already present as window_manager's own dependency; named here because the
  # startup path reads the attached screens directly, to keep the window from
  # reopening on a monitor that is no longer there.
  screen_retriever: ^0.2.0
  windows_single_instance: ^1.1.0
  ffi: ^2.1.3
  docx_creator: ^1.2.3
  http: ^1.2.2
  archive: ^4.0.9
  # Already in the tree by way of pdf; named here because the MCP server
  # encodes GIFs with it, and a dependency used directly should be declared.
  image: ^4.3.0
  crypto: ^3.0.6
  lua_dardo: ^0.0.5
  flutter_js: ^0.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Tests only, to open an exported .docx and read what is actually in it.
  # A .docx is a zip; without this the export tests could assert no more than
  # that the file began with `PK`.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app_icon.png
