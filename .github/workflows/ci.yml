name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # The project standard is zero errors and zero warnings.
      - name: Analyze
        working-directory: code
        run: flutter analyze

      - name: Test
        working-directory: code
        run: flutter test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config liblzma-dev

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # Catches native/plugin breakage that `flutter analyze` cannot see.
      - name: Build
        working-directory: code
        run: flutter build linux --release

      - name: Package
        run: |
          cd code/build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/marktext-plus-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ github.sha }}
          path: marktext-plus-linux-x64.tar.gz
          # These are for looking at a build, not for keeping. The tag-driven
          # release workflow is what produces artefacts meant to last.
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      - name: Build
        working-directory: code
        run: flutter build windows --release

      # Uploaded unzipped: the action zips the directory itself, and a nested
      # archive would need unpacking twice before the exe could be run.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: code/build/windows/x64/runner/Release/
          retention-days: 14
