name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # The project standard is zero errors and zero warnings.
      - name: Analyze
        working-directory: code
        run: flutter analyze

      - name: Test
        working-directory: code
        run: flutter test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config liblzma-dev

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # Catches native/plugin breakage that `flutter analyze` cannot see.
      - name: Build
        working-directory: code
        run: flutter build linux --release
