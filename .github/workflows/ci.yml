name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Back on a current SDK, with the renderer switched instead of the SDK.
  #
  # 3.44.9 was pinned because it launched ten times faster; the reason turned
  # out to be that 3.44.9 has no Impeller on Windows at all. The switch meant
  # to test that on 3.47 was a no-op: it set FLUTTER_ENGINE_SWITCHES, which
  # the engine reads only outside release builds, so both arms of the A/B ran
  # Impeller and the difference between them was noise.
  #
  # windows/runner now asks through set_impeller_switch, which is read. Two
  # installers come out of every build — one each way — until the numbers say
  # which the default should be. flutter/flutter#191860 measures the same
  # thing on a minimal project: 54 ms on Skia against 1183 ms on Impeller.
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # The project standard is zero errors and zero warnings.
      - name: Analyze
        working-directory: code
        run: flutter analyze

      - name: Test
        working-directory: code
        run: flutter test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      # Catches native/plugin breakage that `flutter analyze` cannot see.
      - name: Build
        working-directory: code
        run: |
          flutter build linux --release \
            --dart-define=BUILD_SHA=${GITHUB_SHA} \
            --dart-define=BUILD_RUN=${GITHUB_RUN_NUMBER} \
            --dart-define=BUILD_SDK=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')

      - name: Package
        run: |
          cd code/build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/marktext-plus-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ github.sha }}
          path: marktext-plus-linux-x64.tar.gz
          # These are for looking at a build, not for keeping. The tag-driven
          # release workflow is what produces artefacts meant to last.
          retention-days: 14

  # Can Windows on ARM be built at all? The answer changed under us.
  #
  # It was recorded here as impossible because Flutter publishes no arm64
  # Windows SDK — still true: every one of the 732 releases in the manifest is
  # x64, and `flutter_windows_arm64_*.zip` is a 404. What that hid is that the
  # pieces exist separately. Since Flutter 3.44.0 the bucket carries native
  # arm64 Dart SDK and engine binaries; the release zip simply does not bundle
  # them, and `update_dart_sdk.ps1` will fetch the arm64 ones when it runs in an
  # arm64 PowerShell — which is the default on an arm64 runner. It is held back
  # only by `engine-dart-sdk.stamp`, and the engine's own
  # `windows-arm64-release` artifacts are published for the stable we build on.
  #
  # So this job asks the machine rather than reasoning about it: force the
  # arm64 Dart SDK, build, and read the machine type out of the executable's PE
  # header. Not required to pass — until it does, nothing depends on it.
  probe-windows-arm64:
    name: Probe Windows arm64
    runs-on: windows-11-arm
    needs: analyze
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # The action cannot resolve an arm64 Windows SDK — there is none to
          # resolve, and asking for one is what stopped the last attempt here.
          architecture: x64
          # This SDK gets its Dart swapped out below; it must not be cached as
          # if it were a stock one.
          cache: false

      - name: Swap in the arm64 Dart SDK
        shell: pwsh
        run: |
          $root = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          Write-Host "Flutter root: $root"
          Write-Host "PowerShell architecture: $env:PROCESSOR_ARCHITECTURE"
          Remove-Item "$root\bin\cache\engine-dart-sdk.stamp" -Force -ErrorAction SilentlyContinue
          & "$root\bin\internal\update_dart_sdk.ps1"
          & "$root\bin\dart" --version

      - name: Build
        working-directory: code
        run: |
          flutter --version
          flutter pub get
          flutter build windows --release

      - name: Read the machine type out of the executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter marktext_plus.exe `
            -Path code\build\windows | Select-Object -First 1
          if (-not $exe) { throw "no executable was produced" }
          Write-Host "built: $($exe.FullName)"
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $name = switch ($machine) {
            0xAA64 { "arm64" }
            0x8664 { "x64" }
            default { "unknown (0x{0:X4})" -f $machine }
          }
          Write-Host "machine type: $name"
          if ($name -ne "arm64") {
            throw "built $name, so an arm64 host still produces an x64 binary"
          }

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: code
        run: flutter pub get

      - name: Build
        working-directory: code
        run: |
          flutter --version
          # Stamped in so a trace says which SDK produced the binary. The
          # channel moves under us, and comparing two logs from different weeks
          # without knowing that is comparing two unknowns.
          $sdk = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          # The run number becomes the executable's build number, so no two CI
          # builds carry the same version resource. Inno Setup compares those
          # resources when deciding whether to replace a file: with every build
          # stamped 1.4.0.1, it kept the installed runner and only the Dart
          # snapshot was ever updated. `ignoreversion` in the installer fixes
          # that outright; this removes the reason it happened, and makes the
          # file's properties say which build it came from.
          # --split-debug-info takes the symbol tables out of the AOT snapshot
          # and writes them beside the build instead. The runner's own trace
          # showed where a launch actually goes: 90 ms to load the exe and its
          # DLLs, 50 ms of runner prologue, and 2.7 seconds booting the engine
          # and loading app.so. app.so is 13.6 MB, and this is the one way to
          # make it smaller that costs no feature.
          flutter build windows --release `
            --build-number=$env:GITHUB_RUN_NUMBER `
            --split-debug-info=build\symbols `
            --dart-define=BUILD_SHA=$env:GITHUB_SHA `
            --dart-define=BUILD_RUN=$env:GITHUB_RUN_NUMBER `
            --dart-define=BUILD_SDK=$sdk

      # What Windows has to read before the first line of Dart runs. A slow
      # start was chased for days by asking the person reporting it to measure
      # their own folder, when the build that produced it could have said so
      # itself every time.
      - name: Report what was built
        working-directory: code/build/windows/x64/runner/Release
        shell: pwsh
        run: |
          $all = Get-ChildItem -Recurse -File
          $total = ($all | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("total: {0:N1} MB in {1} files" -f $total, $all.Count)
          $all | Sort-Object Length -Descending | Select-Object -First 15 |
            ForEach-Object {
              Write-Host ("{0,10:N2} MB  {1}" -f ($_.Length / 1MB), $_.Name)
            }

      # An installer as well as the loose files. A folder unzipped from a
      # downloaded artifact carries the mark of the web and is unsigned, so
      # Windows checks it on every launch — which makes it useless for
      # comparing startup against an installed build. Installing puts the
      # program somewhere normal and takes that difference out of the
      # measurement. It is also how anyone would actually run it.
      - name: Create Inno Setup script
        shell: pwsh
        run: |
          # From pubspec plus the run number, so "Programs and Features" names
          # the build rather than showing 0.0.0 for every one of them.
          $pubspecVersion = (Select-String -Path code/pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0].Trim()
          $version = "$pubspecVersion.$env:GITHUB_RUN_NUMBER"
          $iss = @"
          [Setup]
          AppName=MarkText Plus
          AppVersion=$version
          AppPublisher=MarkText Plus
          DefaultDirName={autopf}\MarkText Plus
          DefaultGroupName=MarkText Plus
          OutputDir=${{ github.workspace }}
          OutputBaseFilename=marktext-plus-setup
          Compression=lzma2
          SolidCompression=yes
          SetupIconFile=${{ github.workspace }}\code\windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\marktext_plus.exe
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          ChangesAssociations=yes

          [Registry]
          Root: HKA; Subkey: "Software\Classes\MarkTextPlus.md"; ValueType: string; ValueName: ""; ValueData: "MarkText Plus Markdown File"; Flags: uninsdeletekey
          Root: HKA; Subkey: "Software\Classes\MarkTextPlus.md\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\marktext_plus.exe,0"
          Root: HKA; Subkey: "Software\Classes\MarkTextPlus.md\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\marktext_plus.exe"" ""%1"""
          Root: HKA; Subkey: "Software\Classes\.markdown\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mdown\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mkdn\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.md\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mkd\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mdwn\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mdtxt\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mdtext\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mdx\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.mmd\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.text\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\.txt\OpenWithProgids"; ValueType: string; ValueName: "MarkTextPlus.md"; ValueData: ""; Flags: uninsdeletevalue

          ; Without these, picking this app through "Open with" gives Windows
          ; nowhere to record the choice, so the chooser comes back the next
          ; time the same file is opened.
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe"; ValueType: string; ValueName: "FriendlyAppName"; ValueData: "MarkText Plus"; Flags: uninsdeletekey
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\marktext_plus.exe"" ""%1"""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".md"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".markdown"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".mmd"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".mdown"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".mdtxt"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".mdtext"; ValueData: ""
          Root: HKA; Subkey: "Software\Classes\Applications\marktext_plus.exe\SupportedTypes"; ValueType: string; ValueName: ".txt"; ValueData: ""

          [Files]
          ; ignoreversion is not optional here. Without it Inno compares version
          ; resources for .exe and .dll files and keeps the installed one when
          ; the versions match — and marktext_plus.exe carries the same fixed
          ; version from Runner.rc in every build. The result was that app.so
          ; (no version resource, replaced by timestamp) updated on every
          ; install while the runner executable stayed as it was on the day of
          ; the first install: three rounds of native fixes never reached the
          ; machine that reported the fault.
          Source: "${{ github.workspace }}\code\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\MarkText Plus"; Filename: "{app}\marktext_plus.exe"
          Name: "{autodesktop}\MarkText Plus"; Filename: "{app}\marktext_plus.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\marktext_plus.exe"; Description: "Launch MarkText Plus"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -FilePath "setup.iss" -Encoding UTF8

      - name: Build installer
        run: iscc setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup-${{ github.sha }}
          path: marktext-plus-setup.exe
          retention-days: 14

      # Uploaded unzipped: the action zips the directory itself, and a nested
      # archive would need unpacking twice before the exe could be run.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: code/build/windows/x64/runner/Release/
          retention-days: 14
